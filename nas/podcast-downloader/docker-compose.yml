# SND podcast downloader (yt-dlp) for Ugreen NAS / any Docker host.
# Adjust the downloads volume to your Music share, then deploy in Container Manager.
services:
  podcast-downloader:
    build: .
    image: snd-podcast-downloader:latest
    container_name: snd-podcast-downloader
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      DOWNLOAD_DIR: /downloads
      BIND_HOST: 0.0.0.0
      BIND_PORT: "8091"
      # Optional. Leave empty = no token needed in SND. Set e.g. snd-local to require it.
      AUTH_TOKEN: ""
      MAX_WORKERS: "2"
    volumes:
      # Ugreen example: map the shared Music/Podcasts folder (create Podcasts first).
      # Change the left side to your real path in File Manager / volume1.
      - /volume1/Music/Podcasts:/downloads
