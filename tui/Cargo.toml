[package]
name = "nlc-tui"
version = "0.1.0"
edition = "2021"
description = "Desktop TUI that plays NLC library through the phone LAN bridge"

[dependencies]
crossterm = "0.28"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2.12", features = ["json"] }
urlencoding = "2.1"
base64 = "0.22"
