<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NLC</title>
<link rel="stylesheet" href="/xterm.css">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{display:flex;flex-direction:column;height:100%}
#player{display:none;width:100%;max-height:62vh;background:#000}
#player.show{display:block}
#t{flex:1;min-height:0}
.xterm-viewport{overflow:hidden!important;scrollbar-width:none}
.xterm-viewport::-webkit-scrollbar{display:none;width:0;height:0}
</style>
</head>
<body>
<div id="stage">
<video id="player" controls playsinline></video>
<audio id="audio"></audio>
<div id="t"></div>
</div>
<script src="/xterm.js"></script>
<script src="/addon-fit.js"></script>
<script src="/addon-image.js"></script>
<script>
const term = new Terminal({
  cursorBlink: true,
  fontSize: 15,
  fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
  theme: { background: "#000000" },
  scrollback: 0
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.loadAddon(new ImageAddon.ImageAddon({ iipSupport: true, sixelScrolling: true }));
term.open(document.getElementById("t"));
fit.fit();
let video = document.getElementById("player"), audio = document.getElementById("audio");
let current = null, sequence = 0, busyMedia = false, polling = false, reporting = false, lastReport = 0;
const clientId=Array.from(crypto.getRandomValues(new Uint8Array(16)),byte=>byte.toString(16).padStart(2,"0")).join("");
const leaseId=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),byte=>byte.toString(16).padStart(2,"0")).join("");
async function session(op,args={}) {
 const query=new URLSearchParams({op,client:clientId,...args});const response=await fetch("/session?"+query,{headers:{"X-NLC-Protocol":"1"},cache:"no-store"});
 if(!response.ok)throw new Error("No se pudo conectar con el móvil");const result=await response.json();if(!result.ok)throw new Error(result.error||"phone_unavailable");return result;
}
function localPause() {video.pause();audio.pause();}
function report(el) {
 if (!current || ws.readyState !== 1) return;
 const duration=Number.isFinite(el.duration)?el.duration:0;
 ws.send(JSON.stringify({media:{id:current.id,pos:el.currentTime||0,dur:duration,paused:el.paused,ended:el.ended}}));
 if(current.owner===clientId&&!reporting&&(Date.now()-lastReport>900||el.ended)){reporting=true;lastReport=Date.now();void session("progress",{revision:current.revision,sequence:++sequence,position:el.currentTime||0,duration,playing:el.paused?"0":"1"}).catch(()=>{localPause();}).finally(()=>{reporting=false;});}
}
function bind(el) {["timeupdate","pause","play","ended","seeked"].forEach(name=>el.addEventListener(name,()=>report(el)));}
bind(video);bind(audio);
async function candidate(id,isVideo,position,playing,volume) {
 const el=document.createElement(isVideo?"video":"audio");el.preload="auto";el.playsInline=true;el.controls=isVideo;el.volume=Math.max(0,Math.min(1,(volume??80)/100));
 el.src="/media?id="+encodeURIComponent(id);
 try {await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error("Formato no compatible. Puedes reproducirlo en el móvil.")),15000);el.oncanplay=()=>{clearTimeout(timer);resolve();};el.onerror=()=>{clearTimeout(timer);reject(new Error("Formato no compatible. Puedes reproducirlo en el móvil."));};el.load();});el.currentTime=position||0;if(playing)await el.play();return el;}
 catch(error){el.pause();el.removeAttribute("src");el.load();throw error;}
}
function install(el,id,isVideo,state) {
 const old=isVideo?video:audio;localPause();old.replaceWith(el);old.removeAttribute("src");old.load();
 if(isVideo){video=el;el.id="player";}else{audio=el;el.id="audio";}bind(el);
 current={id,video:isVideo,revision:state.revision,owner:state.owner};sequence=0;video.classList.toggle("show",isVideo);fit.fit();
}
function stateId(state){return state.kind==="video"?"video:"+encodeURIComponent(state.videoPath):state.queue?.[state.index]?.id;}
async function applyMedia(msg) {
 busyMedia=true;
 try {
  if(msg.op==="volume"){(current?.video?video:audio).volume=Math.max(0,Math.min(1,(msg.v||0)/100));return;}
  if(msg.op==="pause"||msg.op==="stop") {const {state}=await session("state");if(state.owner===clientId)await session("control",{method:msg.op==="stop"||msg.paused?"pause":"toggle",revision:state.revision});if(msg.op==="stop")localPause();return;}
  if(msg.op!=="play"||!msg.id)return;
  if(!msg.video&&Array.isArray(msg.queue)&&msg.queue.length){const stage=leaseId();for(let index=0;index<msg.queue.length;index+=10)await session("queue",{stage,part:index/10,queue:JSON.stringify(msg.queue.slice(index,index+10))});}
  const lease=await session("prepare",{id:msg.id,lease:leaseId(),position:Number(msg.start)||0});
  const prepared=await candidate(msg.id,!!msg.video,lease.state.currentTime,true,msg.volume);
  try {let state;try{state=(await session("confirm",{lease:lease.leaseId})).state;}catch(error){state=(await session("state")).state;if(state.owner!==clientId||stateId(state)!==msg.id)throw error;}prepared.currentTime=state.currentTime;install(prepared,msg.id,!!msg.video,state);term.focus();}
  catch(error){prepared.pause();prepared.removeAttribute("src");prepared.load();throw error;}
 } catch(error){term.writeln("\r\n"+(error.message||error));}finally{busyMedia=false;}
}
setInterval(()=>{if(polling||busyMedia||!current)return;polling=true;void(async()=>{
 const {state}=await session("state");if(state.owner!==clientId){current.owner=state.owner;localPause();return;}
 const id=stateId(state);if(!id)return;const isVideo=state.kind==="video";
 if(id!==current.id){const el=await candidate(id,isVideo,state.currentTime,state.playing);install(el,id,isVideo,state);}
 const el=current.video?video:audio,changed=state.revision!==current.revision;current.revision=state.revision;current.owner=state.owner;
 if(changed&&Math.abs(el.currentTime-state.currentTime)>1.5)el.currentTime=state.currentTime;
 if(state.playing&&el.paused)await el.play();else if(!state.playing)el.pause();report(el);
})().catch(()=>localPause()).finally(()=>{polling=false;});},1000);
let mediaCommands=Promise.resolve();
const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
ws.binaryType = "arraybuffer";
ws.onopen = () => {
  const sendSize = () => ws.send(JSON.stringify({ cols: term.cols, rows: term.rows }));
  sendSize();
  term.onData((data) => { if (ws.readyState === 1) ws.send(data); });
  term.onResize(sendSize);
};
ws.onmessage = (ev) => {
  if (ev.data instanceof ArrayBuffer) {
    term.write(new Uint8Array(ev.data));
    return;
  }
  const text = typeof ev.data === "string" ? ev.data : "";
  try {
    const msg = JSON.parse(text);
    if (msg && msg.op) {
      mediaCommands=mediaCommands.catch(()=>{}).then(()=>applyMedia(msg));
      return;
    }
  } catch (_) {}
  if (text) term.write(text);
};
window.addEventListener("resize", () => fit.fit());
</script>
</body>
</html>
