plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.nlc.lanbridge'
version = '0.1.0'

android {
  namespace "app.nlc.lanbridge"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation "org.nanohttpd:nanohttpd:2.3.1"
  implementation "com.facebook.react:react-android"
}
