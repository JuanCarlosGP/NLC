name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run test:integrations

      - run: npm run test:health-backup

      - run: npm run test:nutrition

      - run: npm run test:body-photos

      - run: npm run test:medication

      - run: npm run test:training-analytics

      - run: npm run test:training

      - run: npm run test:health

      - run: npm run test:behavior

  ota:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Publish OTA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          MSG="$(git log -1 --pretty=%s)"
          npx eas-cli update --channel production --non-interactive --message "$MSG"

      - name: Notify devices
        env:
          EXPO_PUSH_TOKEN: ${{ secrets.EXPO_PUSH_TOKEN }}
          EXPO_PUSH_TOKENS: ${{ secrets.EXPO_PUSH_TOKENS }}
          NLC_NAS_PASSWORD: ${{ secrets.NLC_NAS_PASSWORD }}
          SND_NAS_PASSWORD: ${{ secrets.SND_NAS_PASSWORD }}
        run: node scripts/notify-ota.mjs production
        continue-on-error: true
