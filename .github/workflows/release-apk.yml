name: Release APK

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Subir versión de la APK"
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: patch
      notes:
        description: "Notas (opcional)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Bump version
        id: bump
        run: node scripts/bump-apk-version.mjs ${{ inputs.bump }}

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json app.config.js
          if git diff --staged --quiet; then
            echo "Sin cambios de versión"
          else
            git commit -m "chore: APK ${{ steps.bump.outputs.version }} (${{ steps.bump.outputs.versionCode }})"
            git push
          fi

      - name: Build APK
        run: npx eas-cli build --platform android --profile github --non-interactive --wait

      - name: Download APK
        run: |
          node <<'NODE'
          const { spawnSync } = require("node:child_process");
          const fs = require("node:fs");
          const raw = spawnSync(
            "npx",
            ["eas-cli", "build:list", "--platform", "android", "--limit", "1", "--non-interactive", "--json", "--status", "finished"],
            { encoding: "utf8" },
          );
          if (raw.status !== 0) {
            console.error(raw.stderr);
            process.exit(1);
          }
          const parsed = JSON.parse(raw.stdout);
          const builds = Array.isArray(parsed) ? parsed : parsed.builds || [];
          const url = builds[0]?.artifacts?.buildUrl || builds[0]?.artifacts?.applicationArchiveUrl;
          if (!url) {
            console.error(raw.stdout);
            process.exit(1);
          }
          fs.writeFileSync("apk-url.txt", url);
          NODE
          curl -L --fail --output SND.apk "$(cat apk-url.txt)"

      - name: Publish rolling GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-github-apk.mjs SND.apk "${{ steps.bump.outputs.version }}" "${{ steps.bump.outputs.versionCode }}" "${{ inputs.notes }}"

      - name: Notify devices
        env:
          EXPO_PUSH_TOKENS: ${{ secrets.EXPO_PUSH_TOKENS }}
          SND_NAS_PASSWORD: ${{ secrets.SND_NAS_PASSWORD }}
        run: node scripts/notify-ota.mjs apk
        continue-on-error: true
